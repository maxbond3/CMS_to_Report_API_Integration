volumes:
  n8n-data:
  postgres-data:

services:
  db:
    container_name: ${DB_HOST}
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGPORT: ${DB_PORT}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/01_create_spares_table.sql:/docker-entrypoint-initdb.d/01_create_spares_table.sql:ro
      - ./db/02_seed_spares_data.sh:/docker-entrypoint-initdb.d/02_seed_spares_data.sh:ro
      - ./db/spares_seed_data.json:/seed/spares_seed_data.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME} -p ${DB_PORT:-5432}']
      interval: 5s
      timeout: 3s
      retries: 5

  n8n-init:
    image: docker.io/n8nio/n8n:${N8N_VERSION}
    env_file: .env
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflow.json:/backup/workflow.json:ro
      - ./n8n/credentials.json:/backup/credentials.json:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        n8n import:credentials --input=/backup/credentials.json
        n8n import:workflow --input=/backup/workflow.json
        n8n publish:workflow --id=QTQz9XIYboCxDTnl
    depends_on:
      db:
        condition: service_healthy

  n8n:
    image: docker.io/n8nio/n8n:${N8N_VERSION}
    depends_on:
      n8n-init:
        condition: service_completed_successfully
    ports:
      - '5678:5678'
    env_file: .env
    environment:
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
      N8N_AI_ENABLED: 'false'
    volumes:
      - n8n-data:/home/node/.n8n

  runners:
    image: ghcr.io/n8n-io/runners:${N8N_VERSION}
    depends_on:
      - n8n
    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: '15'
